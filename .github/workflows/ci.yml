name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

jobs:
  ci:
    name: CI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22-large
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check (format, lint, typecheck)
        run: bun run check

      # Confirmation step: the websocket proxy tests time out only on the macOS
      # runner. Running the file in isolation with a single fork isolates the
      # failure from event-loop starvation caused by `fileParallelism` on the
      # resource-constrained macOS runner. Verbose output surfaces where it
      # stalls, since a bare timeout logs nothing.
      - name: Test (macOS websocket proxy, isolated)
        if: runner.os == 'macOS'
        working-directory: packages/cloudflare-vite-plugin
        env:
          WS_PROXY_DEBUG: "1"
        run: bunx vitest run test/websockets.test.ts --no-file-parallelism --reporter=verbose

      - name: Test
        run: bun run test
        env:
          TEST_MYSQL_URL: ${{ secrets.TEST_MYSQL_URL }}
          TEST_POSTGRES_URL: ${{ secrets.TEST_POSTGRES_URL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TEST_KV_NAMESPACE_ID: ${{ secrets.TEST_KV_NAMESPACE_ID }}
          TEST_R2_BUCKET_NAME: ${{ secrets.TEST_R2_BUCKET_NAME }}
          TEST_D1_DATABASE_ID: ${{ secrets.TEST_D1_DATABASE_ID }}
          TEST_SERVICE_WORKER_NAME: ${{ secrets.TEST_SERVICE_WORKER_NAME }}
