name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

jobs:
  ci:
    name: CI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22-large
          # Intel macOS is required for Docker: GitHub's arm64 macOS runners
          # (macos-latest) do not support nested virtualization, so Colima/Docker
          # Desktop cannot start a Linux VM there.
          - macos-15-intel
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Docker Desktop is not available on macOS runners (licensing / nested
      # virt). Colima provides a Linux Docker daemon on Intel runners.
      - name: Set up Docker (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install docker colima
          colima start --runtime docker
          docker info

      - name: Check (format, lint, typecheck)
        run: bun run check

      - name: Test
        run: bun run test
        env:
          TEST_MYSQL_URL: ${{ secrets.TEST_MYSQL_URL }}
          TEST_POSTGRES_URL: ${{ secrets.TEST_POSTGRES_URL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TEST_KV_NAMESPACE_ID: ${{ secrets.TEST_KV_NAMESPACE_ID }}
          TEST_R2_BUCKET_NAME: ${{ secrets.TEST_R2_BUCKET_NAME }}
          TEST_D1_DATABASE_ID: ${{ secrets.TEST_D1_DATABASE_ID }}
          TEST_SERVICE_WORKER_NAME: ${{ secrets.TEST_SERVICE_WORKER_NAME }}
