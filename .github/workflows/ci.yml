name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

jobs:
  ci:
    name: CI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22-large
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check (format, lint, typecheck)
        run: bun run check

      - name: Assert test secrets are present
        # Several tests gate on these (`it.skip` without them) — a missing
        # secret must fail loudly here instead of silently shrinking coverage.
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          for v in TEST_MYSQL_URL TEST_POSTGRES_URL; do
            if [ -z "${!v}" ]; then echo "::error::secret $v is empty — env-gated tests would silently skip"; exit 1; fi
          done
          # These two are currently NOT configured as repo secrets, which means
          # RemoteBindings.integration.test.ts has never run on CI. Warn loudly
          # until they are added, then move them into the hard-fail loop above.
          for v in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN; do
            if [ -z "${!v}" ]; then echo "::warning::secret $v is empty — the remote-bindings integration suite silently skips on CI"; fi
          done
        env:
          TEST_MYSQL_URL: ${{ secrets.TEST_MYSQL_URL }}
          TEST_POSTGRES_URL: ${{ secrets.TEST_POSTGRES_URL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Test
        # Windows ran serially (--concurrency=1) after WSAENOBUFS socket-buffer
        # exhaustion under full parallelism (c9183e5, 2026-07-20). Since then
        # the actual churn sources were fixed (keep-alive loopback servers,
        # bounded port scans/retries — ce721e5) and the one suite that exhausts
        # AFD buffers even in isolation is skipped on Windows
        # (fixtures/sveltekit/scripts/e2e.mjs). Four concurrent suites on the
        # 4-core runner cut the test step from ~9.5m to a few minutes; if
        # WSAENOBUFS reappears, step down before re-serializing.
        # The small macOS runners (3 cores) starve under full parallelism too
        # (chromium launches + workerd fleets): three consecutive runs failed
        # on three different single tests, including module-eval crashes while
        # loading playwright configs — bound them to two concurrent suites.
        run: bun run test ${{ runner.os == 'Windows' && '--concurrency=4' || runner.os == 'macOS' && '--concurrency=2' || '' }}
        env:
          TEST_MYSQL_URL: ${{ secrets.TEST_MYSQL_URL }}
          TEST_POSTGRES_URL: ${{ secrets.TEST_POSTGRES_URL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TEST_KV_NAMESPACE_ID: ${{ secrets.TEST_KV_NAMESPACE_ID }}
          TEST_R2_BUCKET_NAME: ${{ secrets.TEST_R2_BUCKET_NAME }}
          TEST_D1_DATABASE_ID: ${{ secrets.TEST_D1_DATABASE_ID }}
          TEST_SERVICE_WORKER_NAME: ${{ secrets.TEST_SERVICE_WORKER_NAME }}
