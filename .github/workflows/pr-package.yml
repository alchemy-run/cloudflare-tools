name: Publish Preview Packages

# Thin consumer of the shared pr-package workflow in alchemy-run/actions.
# Publishes per-package tarballs to pkg.ing on every push to main and PR
# sync, and leaves a sticky PR comment with install URLs pinned to the
# head commit. Only packages whose own dir or a transitive workspace
# dep's dir changed are rebuilt; the `force-ci` label rebuilds all.
#
# `install` is the unscoped package dir — pkg.distilled.cloud
# auto-prefixes the `@distilled.cloud/` scope on install URLs.

on:
  push:
    branches: [main]
  pull_request:
    # `labeled` so adding the `force-ci` label re-triggers the run. We
    # intentionally do NOT listen to `closed` — pr-package tags persist
    # past PR close so existing install URLs keep resolving; the pkg.ing
    # bucket's TTL handles orphan cleanup.
    types: [opened, synchronize, reopened, labeled]

# Reusable workflows can't widen permissions — the caller must grant
# `pull-requests: write` for the sticky install-instructions comment.
permissions:
  contents: read
  pull-requests: write

jobs:
  pr-package:
    uses: alchemy-run/actions/.github/workflows/pr-package.yml@main
    with:
      install-host: pkg.distilled.cloud
      build-command: bun x turbo run build
      packages: |
        [
          { "dir": "packages/cloudflare-rolldown-plugin", "name": "@distilled.cloud/cloudflare-rolldown-plugin", "install": "cloudflare-rolldown-plugin" },
          { "dir": "packages/cloudflare-runtime",         "name": "@distilled.cloud/cloudflare-runtime",         "install": "cloudflare-runtime" },
          { "dir": "packages/cloudflare-vite-plugin",     "name": "@distilled.cloud/cloudflare-vite-plugin",     "install": "cloudflare-vite-plugin" },
          { "dir": "packages/framework-core",             "name": "@distilled.cloud/framework-core",             "install": "framework-core" },
          { "dir": "packages/nextjs",                     "name": "@distilled.cloud/nextjs",                     "install": "nextjs" },
          { "dir": "packages/nuxt",                       "name": "@distilled.cloud/nuxt",                       "install": "nuxt" },
          { "dir": "packages/astro",                      "name": "@distilled.cloud/astro",                      "install": "astro" },
          { "dir": "packages/sveltekit",                  "name": "@distilled.cloud/sveltekit",                  "install": "sveltekit" },
          { "dir": "packages/waku",                       "name": "@distilled.cloud/waku",                       "install": "waku" },
          { "dir": "packages/octane",                     "name": "@distilled.cloud/octane",                     "install": "octane" }
        ]
    secrets: inherit
