name: Release NPM Packages

# Thin consumer of the shared release workflow in alchemy-run/actions.
# It bumps every publishable package to one shared version, commits +
# tags, publishes to npm via OIDC trusted publishing in dependency-graph
# order (waves), then cuts a GitHub Release.
#
# This repo's publish DAG is four waves deep:
#   1. cloudflare-rolldown-plugin
#   2. cloudflare-runtime, framework-core
#   3. cloudflare-vite-plugin, nextjs, nuxt, sveltekit, octane
#   4. astro, waku
#
# `build-mode: per-package` because our packages build to `dist/`
# (the shared up-front artifact only ships `lib/`/`bin/`). Each publish
# job runs the build command inside its own package dir; turbo's
# automatic package scoping + `dependsOn: ^build` builds upstream
# workspace deps first.

on:
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Release spec. Empty = next beta. `patch|minor|major` or `x.y.z`
          for a stable release. `beta[.N]` / `alpha[.N]` / `rc[.N]` for a
          prerelease. Anything else = tag release on `0.0.0-<name>` (no
          git commit/tag/GitHub Release).
        required: false
        type: string
        default: ""
      force-latest:
        description: >-
          Publish under npm's `latest` dist-tag whatever the channel
          (e.g. promote an rc to latest).
        required: false
        type: boolean
        default: false

# Reusable workflows can't widen permissions — the caller must grant
# `contents: write` (commit + tag) and `id-token: write` (npm OIDC).
permissions:
  contents: write
  id-token: write

jobs:
  release:
    uses: alchemy-run/actions/.github/workflows/release.yml@main
    with:
      version: ${{ inputs.version }}
      repo: alchemy-run/cloudflare-tools
      current-version: "0.17.0"
      build-mode: per-package
      build-command: bun x turbo run build
      force-latest: ${{ inputs.force-latest }}
      packages: |
        [
          { "dir": "packages/cloudflare-rolldown-plugin", "name": "@distilled.cloud/cloudflare-rolldown-plugin" },
          { "dir": "packages/cloudflare-runtime",         "name": "@distilled.cloud/cloudflare-runtime" },
          { "dir": "packages/cloudflare-vite-plugin",     "name": "@distilled.cloud/cloudflare-vite-plugin" },
          { "dir": "packages/framework-core",             "name": "@distilled.cloud/framework-core" },
          { "dir": "packages/nextjs",                     "name": "@distilled.cloud/nextjs" },
          { "dir": "packages/nuxt",                       "name": "@distilled.cloud/nuxt" },
          { "dir": "packages/astro",                      "name": "@distilled.cloud/astro" },
          { "dir": "packages/sveltekit",                  "name": "@distilled.cloud/sveltekit" },
          { "dir": "packages/waku",                       "name": "@distilled.cloud/waku" },
          { "dir": "packages/octane",                     "name": "@distilled.cloud/octane" }
        ]
    secrets: inherit
